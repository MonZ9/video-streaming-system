<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>用户主页</title>
    <style>
        body { font-family: Arial; text-align: center; }
        .box { width: 400px; margin: 50px auto; border: 1px solid #ccc; padding: 20px; border-radius: 10px; text-align: left; }
        .item { margin: 10px 0; }
        #followBtn { padding: 8px 16px; cursor: pointer; }
        .comment-input { width: 200px; height: 24px; margin-right: 5px; }
    </style>
</head>
<body onload="loadUserProfile()">
<h2>用户主页</h2>
<div class="box">
    <div class="item">ID：<span id="uid"></span></div>
    <div class="item">用户名：<span id="username"></span></div>
    <div class="item">角色ID：<span id="roleId"></span></div>
    <div class="item">个人简介：<span id="bio"></span></div>
    <!-- 用户动态 -->
    <div class="item">
        <h3>他的动态</h3>
        <div id="postList">加载中...</div>
    </div>
    <div class="item">
        <button id="followBtn" style="display:none;" onclick="toggleFollow()">关注</button>
    </div>
</div>
<button onclick="history.back()">返回</button>

<script src="js/api.js"></script>
<script>
    let currentProfileUserId = null;
    let isFollowed = false;

    function loadUserProfile() {
        const params = new URLSearchParams(window.location.search);
        currentProfileUserId = params.get("userId");
        if (!currentProfileUserId) {
            alert("缺少用户ID");
            return;
        }
        request(`${BASE}/api/user/viewProfile?userId=${currentProfileUserId}`)
            .then(res => {
                if (!res.success) {
                    alert(res.message);
                    return;
                }
                const u = res.data;
                document.getElementById("uid").innerText = u.id;
                document.getElementById("username").innerText = u.username;
                document.getElementById("roleId").innerText = u.roleId;
                document.getElementById("bio").innerText = u.bio || "无";
                loadPosts(currentProfileUserId);

                // 处理关注按钮
                isFollowed = u.isFollowed;
                const btn = document.getElementById("followBtn");
                if (u.isMe) {
                    btn.style.display = "none";  // 不显示关注自己
                } else {
                    btn.style.display = "inline-block";
                    updateFollowBtn();
                }
            })
            .catch(() => alert("加载失败"));
    }

    function updateFollowBtn() {
        const btn = document.getElementById("followBtn");
        if (isFollowed) {
            btn.innerText = "取消关注";
            btn.style.backgroundColor = "#f44336";
            btn.style.color = "white";
        } else {
            btn.innerText = "关注";
            btn.style.backgroundColor = "#4CAF50";
            btn.style.color = "white";
        }
    }

    function toggleFollow() {
        request(`${BASE}/api/follow/toggleFollow?userId=${currentProfileUserId}`)
            .then(res => {
                if (res.success) {
                    isFollowed = res.followed;   // 后端返回最新状态
                    updateFollowBtn();
                } else {
                    alert(res.message);
                }
            })
            .catch(() => alert("操作失败"));
    }

    function loadPosts(userId) {
        request(`${BASE}/api/post/list?userId=${userId}`)
            .then(res => {
                if (!res.success) {
                    document.getElementById("postList").innerHTML = "<p>加载失败</p>";
                    return;
                }
                const posts = res.data;
                let html = '';
                if (!posts || posts.length === 0) {
                    html = '<p>暂无动态</p>';
                } else {
                    posts.forEach(p => {
                        html += `
                        <div class="post-item" style="border-bottom:1px solid #eee; padding:8px 0;">
                            <p style="margin:0;">${p.content}</p>
                            <small style="color:#999;">
                                ${new Date(p.createdAt).toLocaleString()}
                                <button onclick="toggleCommentBox(${p.id})" style="margin-left:10px;">评论</button>
                            </small>
                            <div id="commentBox-${p.id}" style="display:none; margin-top:5px;">
                                <input type="text" id="commentInput-${p.id}" class="comment-input" placeholder="说点什么...">
                                <button onclick="submitPostComment(${p.id})">发送</button>
                                <div id="postCommentList-${p.id}" style="margin-top:5px;"></div>
                            </div>
                        </div>
                    `;
                    });
                }
                document.getElementById("postList").innerHTML = html;
            });
    }

    function toggleCommentBox(postId) {
        const box = document.getElementById(`commentBox-${postId}`);
        if (box.style.display === 'none') {
            box.style.display = 'block';
            loadPostComments(postId);
        } else {
            box.style.display = 'none';
        }
    }

    function loadPostComments(postId) {
        request(`${BASE}/api/comment/getPostComments?postId=${postId}`)
            .then(res => {
                if (!res.success) return;
                const comments = res.data;
                let html = '';
                if (!comments || comments.length === 0) {
                    html = '<p style="color:#999;">暂无评论</p>';
                } else {
                    comments.forEach(c => {
                        html += `
                            <div style="font-size:13px; border-bottom:1px dotted #ddd; padding:3px 0;">
                                <b>${c.username || ('用户' + c.userId)}</b>: ${c.content}
                                <span style="color:#999; font-size:11px;">${new Date(c.createdAt).toLocaleString()}</span>
                            </div>
                        `;
                    });
                }
                document.getElementById(`postCommentList-${postId}`).innerHTML = html;
            });
    }

    function submitPostComment(postId) {
        const input = document.getElementById(`commentInput-${postId}`);
        const content = input.value.trim();
        if (!content) {
            alert("请输入内容");
            return;
        }
        request(`${BASE}/api/comment/addPostComment?postId=${postId}&content=${encodeURIComponent(content)}`)
            .then(res => {
                if (res.success) {
                    input.value = '';
                    loadPostComments(postId);
                } else {
                    alert(res.message || "评论失败");
                }
            });
    }

</script>
</body>
</html>
