<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>所有用户</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            background-color: #f8f8f8;
            margin: 0;
            padding: 20px;
        }
        h2 {
            margin-top: 20px;
        }
        .user-card {
            border: 1px solid #ddd;
            padding: 15px;
            margin: 12px auto;
            width: 320px;
            border-radius: 10px;
            background: #fff;
            text-align: left;
            transition: 0.2s;
        }
        .user-card:hover {
            background: #f3f3f3;
        }
        .user-id {
            color: #888;
            font-size: 13px;
        }
        .username {
            font-size: 16px;
            font-weight: bold;
            margin-top: 6px;
            display: inline-block;
            margin-right: 10px;
        }
        button {
            margin: 5px 5px 0 0;
            padding: 6px 12px;
            cursor: pointer;
            border: none;
            border-radius: 4px;
            background-color: #eee;
        }
        button:hover {
            background-color: #ddd;
        }
        .follow-btn {
            background-color: #4CAF50;
            color: white;
        }
        .follow-btn.unfollow {
            background-color: #f44336;
        }
        .empty {
            color: #999;
            margin-top: 40px;
        }
        #backBtn {
            margin-top: 30px;
            background-color: #555;
            color: white;
        }
    </style>
</head>
<body onload="loadAllUsers()">

<h2>所有用户</h2>

<div id="userListContent">加载中...</div>

<button id="backBtn" onclick="history.back()">返回</button>

<script src="js/api.js"></script>
<script>
    function loadAllUsers() {
        request(`${BASE}/api/user/listUsers`)
            .then(res => {
                if (!res.success) {
                    alert(res.message || "加载失败");
                    return;
                }
                const users = res.data;
                let html = "";
                if (!users || users.length === 0) {
                    html = "<p class='empty'>暂无用户</p>";
                } else {
                    users.forEach(u => {
                        let followBtn = "";
                        if (!u.isMe) {
                            followBtn = u.isFollowed
                                ? `<button class="follow-btn unfollow" onclick="toggleFollowUser(${u.id})">取消关注</button>`
                                : `<button class="follow-btn" onclick="toggleFollowUser(${u.id})">关注</button>`;
                        }
                        html += `
                            <div class="user-card">
                                <div class="user-id">ID：${u.id}</div>
                                <span class="username">用户名：${u.username}</span>
                                <button onclick="goToProfile(${u.id})">查看主页</button>
                                ${followBtn}
                            </div>
                        `;
                    });
                }
                document.getElementById("userListContent").innerHTML = html;
            })
            .catch(err => {
                console.error(err);
                document.getElementById("userListContent").innerHTML = "<p class='empty'>加载失败</p>";
            });
    }

    function toggleFollowUser(userId) {
        request(`${BASE}/api/follow/toggleFollow?userId=${userId}`)
            .then(res => {
                if (res.success) {
                    loadAllUsers(); // 刷新列表
                } else {
                    alert(res.message);
                }
            });
    }

    function goToProfile(userId) {
        window.location.href = `user_profile.html?userId=${userId}`;
    }
</script>

</body>
</html>
