<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>视频详情</title>

  <style>
    body { font-family: Arial; text-align: center; }
    .container { width: 600px; margin: auto; }
    video { width: 100%; border-radius: 10px; }
    .comment-box { margin-top: 20px; text-align: left; }
    textarea { width: 100%; height: 60px; padding: 5px; }
    button { margin-top: 5px; padding: 6px 12px; cursor: pointer; }
    .comment-item { border-top: 1px solid #eee; padding: 10px; position: relative; }
    .comment-item button { margin-left: 5px; }
    .author { color: #666; margin: 5px 0; font-size: 14px; }
    .comment-user { color: #666; font-size: 13px; margin-bottom: 5px; }
    .sort-box { margin-bottom: 10px; }
    .like-count { color: #ff5555; margin-right: 10px; }
    .tag {
      display: inline-block;
      background: #eee;
      border-radius: 12px;
      padding: 2px 10px;
      margin: 2px;
      font-size: 13px;
      color: #333;
    }
  </style>
</head>

<body onload="initPage()">

<div class="container">

  <h2 id="title">加载中...</h2>

  <p id="author" class="author">
    作者：<span id="authorName">加载中...</span>
    <button id="followBtn" onclick="toggleFollow()">关注</button>
    <span id="followerCount">0</span>
    <button onclick="goToAuthorProfile()">查看主页</button>
  </p>

  <div id="videoTags" style="margin: 10px 0;"></div>
  <video id="videoPlayer" controls>
    您的浏览器不支持 video 标签
  </video>

  <p id="desc">加载中...</p>

  <!-- 点赞按钮 -->
  <div style="margin: 10px 0;">
    <button id="likeBtn" onclick="toggleLikeVideo()">👍 点赞</button>
    <span id="videoLikeCount">0</span>
    <button id="favoriteBtn" onclick="toggleFavorite()">⭐ 收藏</button>
  </div>
<!--发表评论-->
  <div class="comment-box">
    <h3>发表评论</h3>
    <textarea id="comment_input"></textarea><br>
    <button onclick="submitComment()">提交评论</button>
  </div>

  <div class="comment-box">
    <h3>评论列表</h3>

    <!-- 排序切换 -->
    <div class="sort-box">
      <label><input type="radio" name="sort" value="time" checked onchange="loadComments(videoId)"> 时间</label>
      <label><input type="radio" name="sort" value="hot" onchange="loadComments(videoId)"> 热度</label>
    </div>

    <div id="commentList">加载中...</div>
  </div>

</div>

<script src="js/api.js"></script>

<script>
  let videoId = null;
  let VIDEO_LIKED = false;  // 用来记录当前用户是否已经点赞
  let FOLLOWED = false;

  function initPage() {
    const params = new URLSearchParams(window.location.search);
    videoId = params.get("id");

    if (!videoId) {
      alert("参数错误");
      return;
    }

    loadUser().then(() => {
      loadVideoDetail();
      loadComments(videoId);
    });
  }

  // 全局新增收藏状态变量（放在其他全局变量旁边）
  let VIDEO_FAVORITED = false;

  function loadVideoDetail() {
    request(`${BASE}/api/video/getVideo?id=${videoId}`)
            .then(data => {

              if (!data.success || !data.data) {
                alert(data.message || "视频不存在");
                document.getElementById("title").innerText = "加载失败";
                document.getElementById("desc").innerText = "";
                document.getElementById("authorName").innerText = "";
                document.getElementById("followerCount").innerText = "0";
                return;
              }

              let video = data.data;
              CURRENT_VIDEO_USER_ID = video.userId;

              // 更新视频信息
              document.getElementById("title").innerText = video.title || "无标题";
              document.getElementById("authorName").innerText = video.authorName || "未知作者";
              document.getElementById("desc").innerText = video.description || "无描述";

              // 标签展示
              const tagsContainer = document.getElementById("videoTags");
              if (video.tags) {
                const tagList = video.tags.split(',').filter(t => t.trim() !== '');
                tagsContainer.innerHTML = tagList.map(t => `<span class="tag">${t.trim()}</span>`).join(' ');
              } else {
                tagsContainer.innerHTML = '';
              }

              document.getElementById("videoPlayer").src = video.url || "";

              // ===== 点赞数 =====
              document.getElementById("videoLikeCount").innerText = video.likeCount || 0;
              VIDEO_LIKED = video.liked || false;
              updateLikeBtn();

              // ===== 关注按钮 =====
              FOLLOWED = video.followed || false;
              document.getElementById("followerCount").innerText = video.followerCount || 0;
              updateFollowBtn();

              if (CURRENT_USER_ID && CURRENT_VIDEO_USER_ID) {
                if (Number(CURRENT_USER_ID) === Number(CURRENT_VIDEO_USER_ID)) {
                  document.getElementById("followBtn").style.display = "none";
                }
              }

              // ===== ⭐ 收藏状态与按钮 =====
              VIDEO_FAVORITED = video.favorited || false;
              updateFavoriteBtn();   // 后面定义

            })
            .catch(err => {
              console.error("video load error:", err);
              alert("网络或服务器异常");
            });
  }

  // ================= 加载评论（最终版） =================
  function loadComments(videoId) {
    const sort = document.querySelector('input[name="sort"]:checked')?.value || 'time';

    request(`${BASE}/api/comment/getCommentsByVideoId?videoId=${videoId}&sort=${sort}`)
            .then(res => {
              let listDiv = document.getElementById("commentList");
              listDiv.innerHTML = "";

              if (!res.success || !res.data || res.data.length === 0) {
                listDiv.innerHTML = "暂无评论";
                return;
              }

              res.data.forEach(comment => {
                let createdAt = comment.createdAt
                        ? new Date(comment.createdAt).toLocaleString()
                        : "";

                let html = `
                    <div class="comment-item">
                        <div class="comment-user">
                            ${comment.username || ("用户" + comment.userId)}
                            <span style="color:#999;font-size:12px;margin-left:10px;">${createdAt}</span>
                        </div>
                        <p>${comment.content}</p>
                        <div>
                            <span class="like-count" data-id="${comment.id}">
                                👍 ${comment.likeCount || 0}
                            </span>
                            <button data-id="${comment.id}" onclick="likeComment(${comment.id})">
                                ${comment.liked ? "取消点赞" : "点赞"}
                            </button>
                            <!-- ⭐ 加入查看主页按钮 -->
                            <button onclick="goToUserProfile(${comment.userId})" style="margin-left:5px;">查看主页</button>
                `;

                if (comment.canDelete) {
                  html += `<button onclick="deleteComment(${comment.id})" style="color:red;">删除</button>`;
                }

                html += `</div></div>`;
                listDiv.innerHTML += html;
              });
            })
            .catch(err => {
              console.error("comment load error:", err);
              alert("评论加载失败");
            });
  }

  // ================= 点赞/取消评论 =================
  function likeComment(commentId) {
    request(`${BASE}/api/like/toggleCommentLike?commentId=${commentId}`)
            .then(res => {
              if (!res.success) {
                alert(res.message || "操作失败");
                return;
              }

              const btn = document.querySelector(`button[data-id="${commentId}"]`);
              const countSpan = document.querySelector(`.like-count[data-id="${commentId}"]`);

              if (btn && countSpan) {
                countSpan.innerText = "👍 " + res.likeCount;
                btn.innerText = res.liked ? "取消点赞" : "点赞";
              }
            })
            .catch(() => alert("操作失败"));
  }

  // ================= 删除评论 =================
  function deleteComment(id) {
    if (!confirm("确定删除吗？")) return;

    request(`${BASE}/api/comment/deleteComment?id=${id}`)
            .then(res => {
              alert(res.message || "操作完成");
              if (res.success) {
                loadComments(videoId);
              }
            })
            .catch(() => alert("删除失败"));
  }

  // ================= 视频点赞/取消 =================
  function toggleLikeVideo() {

    request(`${BASE}/api/like/toggleVideoLike?videoId=${videoId}`)
            .then(res => {

              console.log("toggle返回:", res);

              if (!res.success) {
                alert(res.message || "操作失败");
                return;
              }

              // ⭐ 用后端返回的数据（最稳）
              VIDEO_LIKED = res.liked;
              document.getElementById("videoLikeCount").innerText = res.likeCount;

              updateLikeBtn(); // 刷新按钮状态
            })
            .catch(() => alert("操作失败"));
  }

  //=======按钮刷新函数=======
  function updateLikeBtn() {
    const btn = document.getElementById("likeBtn");

    if (VIDEO_LIKED) {
      btn.innerText = "❤️ 已点赞（点击取消）";
    } else {
      btn.innerText = "👍 点赞";
    }
  }

  function toggleFollow() {

    const targetId = CURRENT_VIDEO_USER_ID;

    request(`${BASE}/api/follow/toggleFollow?userId=${targetId}`)
            .then(res => {

              if (!res.success) {
                alert(res.message);
                return;
              }

              FOLLOWED = res.followed;

              document.getElementById("followerCount").innerText = res.followerCount;

              updateFollowBtn();
            });
  }

  function updateFollowBtn() {

    const btn = document.getElementById("followBtn");

    if (FOLLOWED) {
      btn.innerText = "已关注（点击取消）";
    } else {
      btn.innerText = "关注";
    }
  }

  function goToUserProfile(userId) {
    window.location.href = `user_profile.html?userId=${userId}`;
  }

  function goToAuthorProfile() {
    if (CURRENT_VIDEO_USER_ID) {
      window.location.href = `user_profile.html?userId=${CURRENT_VIDEO_USER_ID}`;
    } else {
      alert("作者信息未加载");
    }
  }

  function toggleFavorite() {
    request(`${BASE}/api/favorite/toggle?type=video&targetId=${videoId}`)
            .then(res => {
              if (res.success) {
                VIDEO_FAVORITED = res.favorited;
                updateFavoriteBtn();
              } else {
                alert(res.message);
              }
            });
  }

  function updateFavoriteBtn() {
    const btn = document.getElementById("favoriteBtn");
    if (btn) {
      btn.innerText = VIDEO_FAVORITED ? "⭐ 已收藏" : "⭐ 收藏";
    }
  }

</script>

</body>
</html>
