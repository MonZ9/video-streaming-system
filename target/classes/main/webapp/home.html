<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>视频列表</title>
  <style>
    body { font-family: Arial; text-align: center; }
    #videoList { display: flex; flex-wrap: wrap; justify-content: center; }
    .card { border: 1px solid #ccc; padding: 15px; margin: 15px; border-radius: 10px; width: 400px; }
    video { width: 100%; border-radius: 8px; }
    button { margin: 5px; padding: 6px 12px; cursor: pointer; }
    #userInfo { margin: 10px; font-weight: bold; color: green; }
    #uploadBox { margin: 20px; padding: 15px; border: 1px dashed #aaa; display: inline-block; }
    textarea { width: 300px; height: 80px; resize: none; }
    #userListBox { margin: 20px auto; width: 400px; border: 1px solid #ccc; padding: 10px; display: none; text-align: left; }
  </style>
</head>

<body onload="initPage()">

<h2>视频列表</h2>

<div id="userInfo">加载中...</div>

<button onclick="applyAdmin()">申请成为管理员</button>
<button id="adminBtn" onclick="goAdmin()" style="display:none;">管理员审批</button>
<button onclick="refreshVideos()">刷新视频</button>
<button onclick="logout()">退出登录</button>
<button onclick="goFollowers()">查看粉丝列表</button>
<button onclick="goFollowing()">查看关注列表</button>
<button onclick="goProfile()">个人主页</button>
<button onclick="window.location.href='all_users.html'">共有用户</button>
<button onclick="window.location.href='categories.html'">进入分区选择</button>

<!-- 上传视频 -->
<div id="uploadBox">
  <h3>上传视频</h3>
  <form id="uploadForm" enctype="multipart/form-data">
    <input type="text" name="title" placeholder="视频标题" required><br><br>
    <textarea name="description" placeholder="请输入视频简介"></textarea><br><br>

    <!-- 分区下拉 -->
    <select name="category">
      <option value="美食">美食</option>
      <option value="探店">探店</option>
      <option value="科技">科技</option>
      <option value="未分类" selected>未分类</option>
    </select><br><br>

    <!-- 标签输入 -->
    <input type="text" name="tags" placeholder="多个标签用逗号分隔"><br><br>

    <input type="file" name="videoFile" required><br><br>
    <button type="button" onclick="uploadVideo()">上传</button>
  </form>
</div>

<div id="videoList"></div>
<div id="userListBox"></div>

<script src="js/api.js"></script>
<script>
  let allVideos = []; // 缓存当前获取的全部视频

  function initPage() {
    loadUser();
    const urlParams = new URLSearchParams(window.location.search);
    const tagsParam = urlParams.get('tags');
    if (tagsParam) {
      getVideosByTags(tagsParam);
    } else {
      getVideos();
    }
  }

  function loadUser() {
    request(`${BASE}/api/user/getUserInfo`)
            .then(res => {
              if (res.success && res.data) {
                const roleId = res.data.roleId;
                document.getElementById("userInfo").innerText = "欢迎你：" + res.data.username;
                CURRENT_USER_ID = res.data.id;
                CURRENT_ROLE_ID = roleId;

                const applyBtn = document.querySelector("button[onclick='applyAdmin()']");
                if (applyBtn) {
                  applyBtn.style.display = (roleId === 1) ? "none" : "inline-block";
                }
                const adminBtn = document.getElementById("adminBtn");
                if (adminBtn) {
                  adminBtn.style.display = (roleId === 1) ? "inline-block" : "none";
                }
              } else {
                window.location.href = "login.html";
              }
            })
            .catch(() => { document.getElementById("userInfo").innerText = "加载用户失败"; });
  }

  // 刷新视频按钮行为
  function refreshVideos() {
    const urlParams = new URLSearchParams(window.location.search);
    const tagsParam = urlParams.get('tags');
    if (tagsParam) {
      getVideosByTags(tagsParam);
    } else {
      getVideos();
    }
  }

  // 获取所有视频（默认）
  function getVideos() {
    request(`${BASE}/api/video/getAllVideos`)
            .then(data => {
              if (!data.success) {
                alert("请先登录！");
                window.location.href = "login.html";
                return;
              }
              allVideos = data.data;
              showRandomThree();
            })
            .catch(() => alert("获取视频失败"));
  }

  // 根据标签获取视频
  function getVideosByTags(tags) {
    request(`${BASE}/api/video/listByTags?tags=${encodeURIComponent(tags)}`)
            .then(res => {
              if (res.success) {
                allVideos = res.data;
                showRandomThree();
              } else {
                alert(res.message || "获取失败");
              }
            });
  }

  // 从全部视频中随机抽取最多3个并渲染
  function showRandomThree() {
    if (!allVideos || allVideos.length === 0) {
      document.getElementById("videoList").innerHTML = "<p>暂无视频</p>";
      return;
    }
    // 随机打乱并取前3个
    const shuffled = [...allVideos].sort(() => Math.random() - 0.5);
    const picked = shuffled.slice(0, 3);
    renderVideoCards(picked);
  }

  // 渲染视频卡片
  function renderVideoCards(list) {
    let html = "";
    list.forEach(v => {
      html += `
        <div class="card">
          <h3 onclick="goToVideo(${v.id})">${v.title}</h3>
          <p>作者：${v.authorName || ("用户" + v.userId)}</p>
          <video src="${v.url}" controls></video>
          <p>${v.description || "无描述"}</p>
          <button onclick="goToVideo(${v.id})">查看详情</button>
          <button onclick="deleteVideoById(${v.id})">删除</button>
        </div>
      `;
    });
    document.getElementById("videoList").innerHTML = html;
  }

  // 其余函数不变
  function showFollowers(userId) {
    request(`${BASE}/api/follow/getFollowers?userId=${userId}`)
            .then(res => {
              if (!res.success) { alert(res.message || "获取粉丝失败"); return; }
              renderUserList(res.data, "粉丝列表");
            });
  }

  function showFollowing(userId) {
    request(`${BASE}/api/follow/getFollowing?userId=${userId}`)
            .then(res => {
              if (!res.success) { alert(res.message || "获取关注失败"); return; }
              renderUserList(res.data, "关注列表");
            });
  }

  function renderUserList(list, title) {
    const box = document.getElementById("userListBox");
    if (!list || list.length === 0) {
      box.innerHTML = `<h3>${title}</h3><p>暂无数据</p>`;
      box.style.display = "block";
      return;
    }
    let html = `<h3>${title}</h3><ul>`;
    list.forEach(u => { html += `<li>${u.username || ("用户" + u.userId)}</li>`; });
    html += `</ul>`;
    box.innerHTML = html;
    box.style.display = "block";
  }

  function logout() {
    request(`${BASE}/api/user/logout`)
            .then(() => { window.location.href = "login.html"; });
  }

  function goToVideo(id) {
    window.location.href = `video.html?id=${id}`;
  }

  function deleteVideoById(id) {
    if (!confirm("确定删除这个视频吗？")) return;
    request(`${BASE}/api/video/deleteVideo?id=${id}`)
            .then(res => {
              alert(res.message);
              if (res.success) getVideos();
            });
  }

  function goFollowers() { window.location.href = "followers.html"; }
  function goFollowing() { window.location.href = "following.html"; }
  function goProfile() { window.location.href = "profile.html"; }
</script>
</body>
</html>
