<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>我的收藏</title>
</head>
<body onload="loadFavorites()">
<h2>我的收藏</h2>
<div id="favList"></div>
<button onclick="history.back()">返回</button>
<script src="js/api.js"></script>
<script>
    function loadFavorites() {
        request(`${BASE}/api/favorite/list`)
            .then(res => {
                if (res.success) {
                    let html = '';
                    res.data.forEach(item => {
                        if (item.type === 'video') {
                            html += `<div><a href="video.html?id=${item.id}">[视频] ${item.title}</a> by ${item.authorName}</div>`;
                        } else if (item.type === 'post') {
                            // 动态增加点击跳转功能
                            html += `<div><b>[动态]</b> <a href="post_detail.html?id=${item.id}">${item.content}</a> by ${item.authorName} (${new Date(item.favTime).toLocaleString()})</div>`;
                        }
                    });
                    document.getElementById("favList").innerHTML = html || '暂无收藏';
                }
            });
    }
</script>
</body>
</html>
