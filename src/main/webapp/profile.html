<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>个人主页</title>

  <style>
    body {
      font-family: Arial;
      text-align: center;
    }

    .box {
      width: 400px;
      margin: 50px auto;
      border: 1px solid #ccc;
      padding: 20px;
      border-radius: 10px;
      text-align: left;
    }

    .item {
      margin: 10px 0;
    }

    textarea {
      width: 100%;
      height: 80px;
    }

    button {
      margin-top: 10px;
      padding: 6px 12px;
      cursor: pointer;
    }
  </style>
</head>

<body onload="loadProfile()">

<h2>个人主页</h2>

<div class="box">

  <div class="item">ID：<span id="uid"></span></div>
  <div class="item">用户名：<span id="username"></span></div>
  <div class="item">角色ID：<span id="roleId"></span></div>

  <div class="item">
    个人简介：
    <textarea id="bio"></textarea>
  </div>

  <button onclick="saveBio()">保存修改</button>

</div>

<script src="js/api.js"></script>

<script>
  function loadProfile() {

    const token = localStorage.getItem("token");

    if (!token) {
      alert("请先登录！");
      window.location.href = "login.html";
      return;
    }

    request(`${BASE}/api/user/getProfile`)
            .then(res => {

              if (!res.success) {
                alert(res.message);
                return;
              }

              const u = res.data;

              document.getElementById("uid").innerText = u.id;
              document.getElementById("username").innerText = u.username;
              document.getElementById("roleId").innerText = u.roleId;
              document.getElementById("bio").value = u.bio || "";

            });
  }

  function saveBio() {
    const bio = document.getElementById("bio").value;

    request(`${BASE}/api/user/updateBio`, {
      method: "POST",
      headers: {
        "Content-Type": "application/x-www-form-urlencoded"
      },
      body: `bio=${encodeURIComponent(bio)}`
    })
            .then(res => {
              alert(res.message);

              if (res.success) {
                loadProfile(); // ⭐ 重新加载
              }
            });
  }
</script>

</body>
</html>
